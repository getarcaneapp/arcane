packages:
  - frontend
  - tests
  - email-templates

autoDedupe: true

update:
  githubActions: true

packageExtensions:
  svelte-codemirror-editor@2.1.0:
    dependencies:
      '@codemirror/autocomplete': ^6.20.3
      '@codemirror/search': ^6.7.0

overrides:
  devalue: '>=5.8.1'
  valibot: ^1.2.0
  validator: ^13.15.22
  undici: ^6.23.0
  ajv: '>=8.18.0'
  eslint>ajv: ^6.14.0
  minimatch: '>=10.2.1'
  socket.io-parser: '>=4.2.6'
  kysely: '>=0.28.14'
  effect: ^3.22.2
  picomatch: '>=4.0.4'
  brace-expansion: '>=5.0.9'
  esbuild: '>=0.28.1'
  postcss: '>=8.5.23'
  uuid: '>=11.1.1'
  fast-uri: '>=3.1.5'
  ws: '>=8.20.1'
  '@sveltejs/kit': ^3.0.0
  '@sveltejs/adapter-static': ^4.0.0
  dompurify: '>=3.4.11'
  ts-deepmerge: '>=8.0.0'
  joi: '>=17.13.4'
  vite@*: 'catalog:'

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
    'formsnap@2.0.1>sveltekit-superforms': ^3.0.0

minimumReleaseAgeExclude:
  - '@sveltejs/kit@3.0.0'
  - '@sveltejs/adapter-static@4.0.0'
  - '@voidzero-dev/vite-plus-core@1.1.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.1.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.1.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.1.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.1.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.1.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.1.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.1.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.1.0'
  - vite-plus@1.1.0
