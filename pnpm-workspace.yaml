packages:
  - frontend
  - tests
  - email-templates

packageExtensions:
  svelte-codemirror-editor@2.1.0:
    dependencies:
      '@codemirror/autocomplete': ^6.20.3
      '@codemirror/search': ^6.7.0
  '@sveltejs/kit':
    dependencies:
      rolldown: 1.2.3

overrides:
  devalue: '>=5.8.1'
  valibot: ^1.2.0
  validator: ^13.15.22
  cookie: ^1.0.2
  undici: ^6.23.0
  ajv: '>=8.18.0'
  minimatch: '>=10.2.1'
  socket.io-parser: '>=4.2.6'
  kysely: '>=0.28.14'
  effect: '>=3.20.0'
  picomatch: '>=4.0.4'
  brace-expansion: '>=5.0.9'
  esbuild: '>=0.28.1'
  postcss: '>=8.5.23'
  uuid: '>=11.1.1'
  fast-uri: '>=3.1.5'
  ws: '>=8.20.1'
  '@sveltejs/kit': '^3.0.0-next.13'
  '@sveltejs/adapter-static': '>=4.0.0-next.2'
  dompurify: '>=3.4.11'
  ts-deepmerge: '>=8.0.0'
  joi: '>=17.13.4'
  vite: 'catalog:'

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@0.2.9'
  - '@voidzero-dev/vite-plus-darwin-arm64@0.2.9'
  - '@voidzero-dev/vite-plus-darwin-x64@0.2.9'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@0.2.9'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@0.2.9'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@0.2.9'
  - '@voidzero-dev/vite-plus-linux-x64-musl@0.2.9'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@0.2.9'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@0.2.9'
  - vite-plus@0.2.9

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
