name: Publish next registry images
description: Build and sign manager and agent images for one registry
inputs:
  registry:
    description: Destination registry
    required: true
  username:
    description: Registry username
    required: true
  password:
    description: Registry password
    required: true
runs:
  using: composite
  steps:
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1.21.0
      with:
        node-version: 26
        cache: true
        run-install: true

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - name: Set up Depot CLI
      uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
      with:
        configure-docker: true

    - name: Login to destination registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Validate destination registry
      shell: bash
      run: |
        case '${{ inputs.registry }}' in
          ghcr.io|docker.io|quay.io) ;;
          *) echo 'Unsupported image registry' >&2; exit 1 ;;
        esac

    - name: Capture frontend build versions
      id: frontend-versions
      shell: bash
      run: |
        echo "node_version=$(node --version)" >> "$GITHUB_OUTPUT"
        echo "sveltekit_version=$(vp -C frontend node -p 'require("@sveltejs/kit/package.json").version')" >> "$GITHUB_OUTPUT"

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        distribution: goreleaser-pro
        version: '~> 2'
        args: release --clean --nightly --skip=announce,validate,archive,nfpm,notarize,homebrew
      env:
        IMAGE_REGISTRY: ${{ inputs.registry }}
        NODE_VERSION: ${{ steps.frontend-versions.outputs.node_version }}
        SVELTEKIT_VERSION: ${{ steps.frontend-versions.outputs.sveltekit_version }}
