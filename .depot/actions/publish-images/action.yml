name: Publish registry images
description: Copy and sign canonical manager and agent images
inputs:
  registry:
    description: Destination registry
    required: true
  username:
    description: Registry username
    required: true
  password:
    description: Registry password
    required: true
  manager-digest:
    description: Canonical manager image index digest
    required: true
  agent-digest:
    description: Canonical agent image index digest
    required: true
  version:
    description: Image version without a leading v
    required: true
  channel:
    description: next or release
    required: true
runs:
  using: composite
  steps:
    - name: Setup ORAS
      uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      with:
        version: 1.3.1

    - name: Ensure envsubst is installed
      shell: bash
      run: |
        if ! command -v envsubst >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y gettext-base
        fi

    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.0.6

    - name: Login to destination registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
      env:
        AWS_REGION: us-east-1

    - name: Copy and sign registry images
      shell: bash
      env:
        IMAGE_REGISTRY: ${{ inputs.registry }}
        MANAGER_DIGEST: ${{ inputs.manager-digest }}
        AGENT_DIGEST: ${{ inputs.agent-digest }}
        IMAGE_VERSION: ${{ inputs.version }}
        IMAGE_CHANNEL: ${{ inputs.channel }}
      run: bash "${{ github.workspace }}/scripts/ci/publish-images.sh"
