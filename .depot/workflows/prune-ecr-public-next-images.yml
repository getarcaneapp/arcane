name: Prune ECR Public Next Images

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: build-next-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    runs-on:
      size: 4x16
      image: g7r5wqb57k.registry.depot.dev/ci:latest
    env:
      AWS_REGION: us-east-1
      TZ: UTC
      AWS_ACCESS_KEY_ID: ${{ secrets.ECR_PUBLIC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ECR_PUBLIC_SECRET_ACCESS_KEY }}

    steps:
      - name: Login to ECR Public
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: public.ecr.aws
          username: ${{ secrets.ECR_PUBLIC_ACCESS_KEY_ID }}
          password: ${{ secrets.ECR_PUBLIC_SECRET_ACCESS_KEY }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.1

      - name: Delete stale next images
        run: bash scripts/ci/prune-ecr-images.sh
