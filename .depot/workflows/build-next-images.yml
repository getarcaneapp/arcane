name: Build Next Versions of Arcane and CLI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-next-images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  next-version:
    runs-on:
      size: 4x16
      image: g7r5wqb57k.registry.depot.dev/ci:latest
    outputs:
      version: ${{ steps.next-version.outputs.version }}
      previous-tag: ${{ steps.next-version.outputs.previous_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute next image version
        id: next-version
        run: just release version github-output

  build-next-images:
    needs: next-version
    outputs:
      manager-digest: ${{ steps.digests.outputs.manager }}
      agent-digest: ${{ steps.digests.outputs.agent }}
      version: ${{ steps.digests.outputs.version }}
    runs-on:
      size: 32x128
      image: g7r5wqb57k.registry.depot.dev/ci:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: 26
          cache: true
          run-install: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            */go.mod
            */go.sum

      - name: Capture frontend build versions
        id: frontend-versions
        run: |
          echo "node_version=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "sveltekit_version=$(vp -C frontend node -p 'require("@sveltejs/kit/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Request App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ARCANE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARCANE_APP_PRIVATE_KEY }}
          owner: getarcaneapp
          repositories: arcane
          permission-contents: read

      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
        with:
          configure-docker: true

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.ARCANE_BOT_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Setup ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: '~> 2'
          args: release --clean --nightly --skip=announce,validate,homebrew
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          BUILD_NEXT: 'true'
          SKIP_RELEASE: 'true'
          SKIP_CHANGELOG: 'true'
          NEXT_IMAGE_VERSION: ${{ needs.next-version.outputs.version }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.next-version.outputs.previous-tag }}
          NODE_VERSION: ${{ steps.frontend-versions.outputs.node_version }}
          SVELTEKIT_VERSION: ${{ steps.frontend-versions.outputs.sveltekit_version }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Resolve canonical image digests
        id: digests
        env:
          IMAGE_VERSION: ${{ needs.next-version.outputs.version }}
        run: |
          for image in manager agent; do
            digest=$(oras resolve "ghcr.io/getarcaneapp/$image:v$IMAGE_VERSION")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid canonical digest for $image: $digest"
              exit 1
            fi
            echo "$image=$digest" >> "$GITHUB_OUTPUT"
          done
          echo "version=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"

  publish-images:
    name: Publish ${{ matrix.registry }}
    needs: build-next-images
    runs-on:
      size: 4x16
      image: g7r5wqb57k.registry.depot.dev/ci:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: ghcr.io
            username-secret: GHCR_USERNAME
            password-secret: ARCANE_BOT_TOKEN
          - registry: docker.io
            username-secret: DOCKER_USER
            password-secret: DOCKER_PAT
          - registry: quay.io
            username-secret: QUAY_USERNAME
            password-secret: QUAY_TOKEN
          - registry: public.ecr.aws
            username-secret: ECR_PUBLIC_ACCESS_KEY_ID
            password-secret: ECR_PUBLIC_SECRET_ACCESS_KEY

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish registry images
        uses: ./.depot/actions/publish-images
        with:
          registry: ${{ matrix.registry }}
          username: ${{ matrix.registry == 'ghcr.io' && vars.GHCR_USERNAME || secrets[matrix.username-secret] }}
          password: ${{ secrets[matrix.password-secret] }}
          manager-digest: ${{ needs.build-next-images.outputs.manager-digest }}
          agent-digest: ${{ needs.build-next-images.outputs.agent-digest }}
          version: ${{ needs.build-next-images.outputs.version }}
          channel: next
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
