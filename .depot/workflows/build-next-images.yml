name: Build Next Versions of Arcane and CLI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-next-images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  next-version:
    runs-on: depot-ubuntu-24.04-4
    outputs:
      version: ${{ steps.next-version.outputs.version }}
      previous-tag: ${{ steps.next-version.outputs.previous_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup version tools
        uses: taiki-e/install-action@v2
        with:
          tool: just,git-cliff

      - name: Compute next image version
        id: next-version
        run: just next-image-version github-output

  build-next-images:
    needs: next-version
    runs-on: depot-ubuntu-24.04-32

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@9446e853b27985e00fb1b21193be026fc09198db
        with:
          node-version: 26
          cache: true
          run-install: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Capture frontend build versions
        id: frontend-versions
        run: |
          echo "node_version=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "sveltekit_version=$(vp -C frontend node -p 'require("@sveltejs/kit/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Request App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ARCANE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARCANE_APP_PRIVATE_KEY }}
          owner: getarcaneapp
          repositories: arcane
          permission-contents: read

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser-pro
          version: '~> 2'
          args: release --clean --nightly --skip=announce,validate,homebrew,docker
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          BUILD_NEXT: 'true'
          SKIP_RELEASE: 'true'
          SKIP_CHANGELOG: 'true'
          NEXT_IMAGE_VERSION: ${{ needs.next-version.outputs.version }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.next-version.outputs.previous-tag }}
          NODE_VERSION: ${{ steps.frontend-versions.outputs.node_version }}
          SVELTEKIT_VERSION: ${{ steps.frontend-versions.outputs.sveltekit_version }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

  publish-images:
    name: Publish ${{ matrix.registry }}
    needs: next-version
    runs-on: depot-ubuntu-24.04-32
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: ghcr.io
            username-secret: GHCR_USERNAME
            password-secret: ARCANE_BOT_TOKEN
          - registry: docker.io
            username-secret: DOCKER_USER
            password-secret: DOCKER_PAT
          - registry: quay.io
            username-secret: QUAY_USERNAME
            password-secret: QUAY_TOKEN

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish registry images
        uses: ./.depot/actions/publish-images
        with:
          registry: ${{ matrix.registry }}
          username: ${{ matrix.registry == 'ghcr.io' && vars.GHCR_USERNAME || secrets[matrix.username-secret] }}
          password: ${{ secrets[matrix.password-secret] }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          BUILD_NEXT: 'true'
          SKIP_RELEASE: 'true'
          SKIP_CHANGELOG: 'true'
          NEXT_IMAGE_VERSION: ${{ needs.next-version.outputs.version }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.next-version.outputs.previous-tag }}
