name: Build Next Versions of Arcane and CLI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-next-images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  next-version:
    runs-on:
      size: 4x16
      image: g7r5wqb57k.registry.depot.dev/ci:latest
    outputs:
      version: ${{ steps.next-version.outputs.version }}
      previous-tag: ${{ steps.next-version.outputs.previous_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute next image version
        id: next-version
        run: just next-image-version github-output

  build-next-images:
    needs: next-version
    runs-on:
      size: 32x128
      image: g7r5wqb57k.registry.depot.dev/ci:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1.21.0
        with:
          node-version: 26
          cache: true
          run-install: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Capture frontend build versions
        id: frontend-versions
        run: |
          echo "node_version=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "sveltekit_version=$(vp -C frontend node -p 'require("@sveltejs/kit/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Request App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ARCANE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARCANE_APP_PRIVATE_KEY }}
          owner: getarcaneapp
          repositories: arcane
          permission-contents: read

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: '~> 2'
          args: release --clean --nightly --skip=announce,validate,homebrew,docker
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          BUILD_NEXT: 'true'
          SKIP_RELEASE: 'true'
          SKIP_CHANGELOG: 'true'
          NEXT_IMAGE_VERSION: ${{ needs.next-version.outputs.version }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.next-version.outputs.previous-tag }}
          NODE_VERSION: ${{ steps.frontend-versions.outputs.node_version }}
          SVELTEKIT_VERSION: ${{ steps.frontend-versions.outputs.sveltekit_version }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

  publish-images:
    name: Publish ${{ matrix.registry }}
    needs: next-version
    runs-on:
      size: 32x128
      image: g7r5wqb57k.registry.depot.dev/ci:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: ghcr.io
            username-secret: GHCR_USERNAME
            password-secret: ARCANE_BOT_TOKEN
          - registry: docker.io
            username-secret: DOCKER_USER
            password-secret: DOCKER_PAT
          - registry: quay.io
            username-secret: QUAY_USERNAME
            password-secret: QUAY_TOKEN

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish registry images
        uses: ./.depot/actions/publish-images
        with:
          registry: ${{ matrix.registry }}
          username: ${{ matrix.registry == 'ghcr.io' && vars.GHCR_USERNAME || secrets[matrix.username-secret] }}
          password: ${{ secrets[matrix.password-secret] }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          BUILD_NEXT: 'true'
          SKIP_RELEASE: 'true'
          SKIP_CHANGELOG: 'true'
          NEXT_IMAGE_VERSION: ${{ needs.next-version.outputs.version }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.next-version.outputs.previous-tag }}
