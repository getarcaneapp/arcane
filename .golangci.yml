version: '2'

run:
  go: '1.27.3'
  build-tags:
    - exclude_frontend
    - playwright
  timeout: 15m
  allow-serial-runners: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true

linters:
  default: none
  enable:
    - copyloopvar
    - decorder
    - depguard
    - errcheck
    - errorlint
    - exptostd
    - exhaustruct_v5
    - forbidigo
    - gocognit
    - gocritic
    - gomodguard_v2
    - govet
    - grouper
    - importas
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nolintlint
    - perfsprint
    - revive
    - sloglint
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused

  disable:
    - gocyclo

  settings:
    decorder:
      dec-order:
        - type
        - const
        - var
        - func
      ignore-underscore-vars: false
      disable-dec-order-check: false
      disable-init-func-first-check: false
      disable-dec-num-check: true

    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/docker/docker/errdefs
              desc: use github.com/containerd/errdefs instead.
            - pkg: 'github.com/google/uuid'
              desc: Use stdlib uuid instead.
            - pkg: 'gopkg.in/yaml.v3'
              desc: Use go.yaml.in/yaml/v4 instead.
        migrations:
          files:
            - '**/internal/database/migrations/**'
          deny:
            - pkg: gorm.io
              desc: Go migrations must use raw SQL, not GORM models.
            - pkg: github.com/getarcaneapp/arcane/backend/v3/internal
              desc: Go migrations must not depend on application packages that change after the migration version.
            - pkg: github.com/getarcaneapp/arcane/types
              desc: Go migrations must not depend on shared contracts that change after the migration version.

    exhaustruct_v5:
      explicit-mode: true

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: 'context\.Background'
          pkg: '^context$'
          msg: 'in tests, use t.Context() instead of context.Background()'
        - pattern: 'context\.TODO'
          pkg: '^context$'
          msg: 'in tests, use t.Context() instead of context.TODO()'

    gocritic:
      disabled-checks:
        - paramTypeCombine
        - unnamedResult
        - whyNoLint
      enabled-tags:
        - diagnostic
        - opinionated
        - style

    gocognit:
      min-complexity: 45

    importas:
      alias:
        - pkg: kit.getarcane.app/docker
          alias: docker
        - pkg: kit.getarcane.app
          alias: kit
        - pkg: github.com/getarcaneapp/arcane/backend/v3/internal/docker
          alias: dockerInternal
        - pkg: charm.land/log/v2
          alias: charmLog

    lll:
      line-length: 200

    govet:
      enable-all: true
      settings:
        shadow:
          strict: true

    grouper:
      const-require-single-const: true
      const-require-grouping: false
      var-require-single-var: true
      var-require-grouping: false
      type-require-single-type: true
      type-require-grouping: false

    nakedret:
      # Disallow naked returns if func has more lines of code than this setting.
      # Default: 30
      max-func-lines: 0

    revive:
      rules:
        - name: package-comments
          disabled: true

    sloglint:
      context: 'all' # https://github.com/go-simpler/sloglint#context-only
      kv-only: true # https://github.com/go-simpler/sloglint#key-value-pairs-only
      static-msg: true # https://github.com/go-simpler/sloglint#static-message
      key-naming-case: camel

  exclusions:
    generated: strict
