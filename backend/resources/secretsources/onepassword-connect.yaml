apiVersion: arcane.secretsource/v1
id: onepassword-connect
name: 1Password Connect
description: Fields of one item from a 1Password Connect server. Field labels become keys.
kind: http
inputs:
  baseUrl:
    label: Connect server URL
    placeholder: http://op-connect:8080
    required: true
  vault:
    label: Vault ID
    required: true
  item:
    label: Item ID
    required: true
credentials:
  token:
    label: Connect token
    required: true
fetch:
  method: GET
  path: "/v1/vaults/{{ .inputs.vault }}/items/{{ .inputs.item }}"
  headers:
    Authorization: "Bearer {{ .credentials.token }}"
extract:
  - from: fields
    list:
      key: label
      value: value
