syntax = "proto3";

package tunnel.v1;

option go_package = "github.com/getarcaneapp/arcane/backend/v3/proto/tunnel/v1;tunnelpb";

// TunnelService is the reverse tunnel between an edge agent and manager.
service TunnelService {
  // Agent opens a persistent bidi stream to manager.
  rpc Connect(stream AgentMessage) returns (stream ManagerMessage);
}

// Messages sent from the agent to the manager.
message AgentMessage {
  reserved 1 to 6, 8 to 14;
  reserved "http_response", "heartbeat_ping", "ws_data", "ws_close", "stream_data", "stream_end", "event", "command_ack", "command_output", "command_complete", "file_chunk", "stream_close", "cancel_request";

  oneof payload {
    RegisterRequest register = 7;
    // Raw multiplexed session bytes, sent only after the manager grants mux-grant-v1.
    MuxData mux_data = 15;
  }
}

// Messages sent from the manager to the agent.
message ManagerMessage {
  reserved 1 to 5, 7 to 14;
  reserved "http_request", "heartbeat_pong", "ws_start", "ws_data", "ws_close", "command_request", "stream_open", "stream_close", "cancel_request", "file_chunk", "stream_data", "stream_end", "command_credit";

  oneof payload {
    RegisterResponse register_response = 6;
    // Raw multiplexed session bytes, sent only after the manager grants mux-grant-v1.
    MuxData mux_data = 15;
  }
}

message RegisterRequest {
  string agent_token = 1;
  string agent_instance_id = 2;
  // Offered features, e.g. mux-v1 to switch to the multiplexed data plane.
  repeated string capabilities = 3;
  string resume_session_id = 4;
}

message RegisterResponse {
  bool accepted = 1;
  string environment_id = 2;
  string error = 3;
  string session_id = 4;
  string security_mode = 5;
  // Granted features; mux-grant-v1 switches both peers to mux_data after this response.
  repeated string capabilities = 6;
  bool drain_previous = 7;
  string id = 8;
}

// MuxData carries an opaque slice of the multiplexed session byte stream.
message MuxData {
  bytes data = 1;
}
