services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    # A directory created under the data dir is served as a bucket, so backups
    # have somewhere to write without a separate provisioning container.
    entrypoint:
      ['sh', '-c', 'mkdir -p /data/arcane-backups && exec minio server /data --address :9000']
    environment:
      - MINIO_ROOT_USER=arcane-test
      - MINIO_ROOT_PASSWORD=arcane-test-secret
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/minio/health/live']
      interval: 2s
      timeout: 5s
      retries: 15

  arcane:
    image: arcane:playwright-tests
    ports:
      - '3000:3552'
    environment:
      - ENVIRONMENT=testing
      - APP_ENV=test
      - PUID=65532
      - PGID=65532
      - ENCRYPTION_KEY=3JDIgolks2tJ9ymm1AdqzlYMWu0DUWyt
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - ADMIN_STATIC_API_KEY=${E2E_ADMIN_STATIC_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane_data:/app/data
      - ./projects:/app/data/projects
    depends_on:
      minio:
        condition: service_healthy
    build:
      args:
        - BUILD_TAGS=playwright
      context: ../..
      dockerfile: docker/Dockerfile

volumes:
  arcane_data:
