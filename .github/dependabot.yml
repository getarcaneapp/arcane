version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    ignore:
      - dependency-name: 'typescript'
        versions:
          - '>=7.0.0 <7.1.0'
    cooldown:
      default-days: 2
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '17:00'
      timezone: 'America/Chicago'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 1
    pull-request-branch-name:
      separator: '-'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      javascript:
        applies-to: version-updates
        patterns:
          - '*'
      javascript-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: 'gomod'
    directory: '/backend'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '17:00'
