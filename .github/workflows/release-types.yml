name: Release Types Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: Types module version (e.g. v3.0.0)
        type: string
        required: true

concurrency:
  group: release-types
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release types module
    if: github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Just
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just

      - name: Check version
        id: check
        env:
          VERSION: ${{ inputs.version }}
        run: just types check "$VERSION" github-output

      - name: Setup Go
        if: steps.check.outputs.publish == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: types/go.mod
          cache: true
          cache-dependency-path: |
            go.work
            go.work.sum
            */go.mod
            */go.sum

      - name: Verify types and consumers
        if: steps.check.outputs.publish == 'true'
        run: just types verify

      - name: Run Golangci-lint
        if: steps.check.outputs.publish == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --config=../.golangci.yml
          working-directory: types
          only-new-issues: false

      - name: Publish types release
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ inputs.version }}
          PREVIOUS_TAG: ${{ steps.check.outputs.previous_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: just types publish "$VERSION" "$PREVIOUS_TAG"
