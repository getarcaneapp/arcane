name: Preview Image

# Ad-hoc preview build combining feat/host-terminal + feat/snippets (already merged
# into feat/snippets) — pushed to GHCR under this fork so it can be pulled for review.

on:
  push:
    branches:
      - feat/snippets
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/arcane:preview-snippets-terminal
          build-args: |
            VERSION=preview-snippets-terminal
