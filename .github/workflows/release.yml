name: Release New Arcane Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto uses conventional commits)
        type: choice
        default: auto
        options:
          - auto
          - major
          - minor
          - patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare release
    runs-on: depot-ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}

    steps:
      - name: Require the main branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Releases must be triggered from main."
            exit 1
          fi

      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup git-cliff
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: git-cliff@2.14.2

      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(git cliff --bumped-version --unreleased --offline --bump "$BUMP")
          version=${version#v}
          if [[ "$version" == "$(jq -r .version .arcane.json)" ]]; then
            echo "No commits requiring a version bump; no release created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Preparing release v$version from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: Update version files and changelog
        if: steps.version.outputs.tag != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          jq --arg version "$VERSION" --arg revision "$GITHUB_SHA" --arg build_time "$build_time" \
            '.version = $version | .revision = $revision | .buildTime = $build_time' .arcane.json > "$RUNNER_TEMP/arcane.json"
          mv "$RUNNER_TEMP/arcane.json" .arcane.json
          jq --tab --arg version "$VERSION" '.version = $version' frontend/package.json > "$RUNNER_TEMP/package.json"
          mv "$RUNNER_TEMP/package.json" frontend/package.json
          git cliff --prepend CHANGELOG.md --tag "$RELEASE_TAG" --unreleased

      - name: Request App Token
        if: steps.version.outputs.tag != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ARCANE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARCANE_APP_PRIVATE_KEY }}
          owner: getarcaneapp
          repositories: arcane
          permission-contents: write

      - name: Commit and tag release
        if: steps.version.outputs.tag != ''
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          # Attribute the release commit to the app and authenticate the push with its installation token
          bot_name="$APP_SLUG[bot]"
          bot_id=$(gh api "users/$bot_name" --jq .id)
          git config user.name "$bot_name"
          git config user.email "$bot_id+$bot_name@users.noreply.github.com"
          gh auth setup-git

          git add .arcane.json frontend/package.json CHANGELOG.md
          git commit -m "release: $VERSION"
          for tag in "$RELEASE_TAG" "cli/$RELEASE_TAG" "types/$RELEASE_TAG" "backend/$RELEASE_TAG"; do
            git tag -a "$tag" -m "$VERSION"
          done

          # Publish all refs together so a concurrent main update cannot leave orphaned release tags
          git push --atomic origin HEAD:refs/heads/main \
            "refs/tags/$RELEASE_TAG" \
            "refs/tags/cli/$RELEASE_TAG" \
            "refs/tags/types/$RELEASE_TAG" \
            "refs/tags/backend/$RELEASE_TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and attest
    needs: prepare
    outputs:
      manager-digest: ${{ steps.digests.outputs.manager }}
      agent-digest: ${{ steps.digests.outputs.agent }}
      version: ${{ steps.digests.outputs.version }}
    if: needs.prepare.outputs.tag != ''
    runs-on: depot-ubuntu-24.04-16
    permissions:
      contents: write
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write

    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      MANAGER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/manager
      AGENT_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/agent

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: 26
          cache: true
          run-install: true

      - name: Set up Depot CLI
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2
        with:
          configure-docker: true

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Frontend Dependencies
        run: just deps install frontend

      - name: Build Arcane Frontend
        run: just build single frontend

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: |
            backend/go.sum
            cli/go.sum

      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Setup ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.1

      - name: Capture frontend build versions
        id: frontend-versions
        run: |
          echo "node_version=$(node --version)" >> "$GITHUB_OUTPUT"
          echo "sveltekit_version=$(vp -C frontend node -p 'require("@sveltejs/kit/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Request App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ARCANE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARCANE_APP_PRIVATE_KEY }}
          owner: getarcaneapp
          repositories: arcane,homebrew-tap
          permission-contents: write

      - name: Create draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Reuse the draft when retrying a failed build
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$is_draft" != true ]]; then
              echo "::error::Release $RELEASE_TAG is already published."
              exit 1
            fi
          else
            awk '/^## v[0-9]/ { if (found) exit; found=1; next } found' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: '~> v2'
          args: release --clean --skip=validate,announce
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          DISCORD_WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
          DISCORD_WEBHOOK_TOKEN: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NODE_VERSION: ${{ steps.frontend-versions.outputs.node_version }}
          SVELTEKIT_VERSION: ${{ steps.frontend-versions.outputs.sveltekit_version }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Resolve canonical image digests
        id: digests
        env:
          IMAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for image in manager agent; do
            digest=$(oras resolve "ghcr.io/getarcaneapp/$image:v$IMAGE_VERSION")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid canonical digest for $image: $digest"
              exit 1
            fi
            echo "$image=$digest" >> "$GITHUB_OUTPUT"
          done
          echo "version=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Container image attestation (manager)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.MANAGER_IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.manager }}
          push-to-registry: true

      - name: Container image attestation (agent)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.AGENT_IMAGE_NAME }}
          subject-digest: ${{ steps.digests.outputs.agent }}
          push-to-registry: true

  publish-images:
    name: Publish ${{ matrix.registry }}
    needs: [prepare, build]
    runs-on: depot-ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: ghcr.io
            username-secret: GHCR_USERNAME
            password-secret: GITHUB_TOKEN
          - registry: docker.io
            username-secret: DOCKER_USER
            password-secret: DOCKER_PAT
          - registry: quay.io
            username-secret: QUAY_USERNAME
            password-secret: QUAY_TOKEN
          - registry: public.ecr.aws
            username-secret: ECR_PUBLIC_ACCESS_KEY_ID
            password-secret: ECR_PUBLIC_SECRET_ACCESS_KEY

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Publish registry images
        uses: ./.depot/actions/publish-images
        with:
          registry: ${{ matrix.registry }}
          username: ${{ matrix.registry == 'ghcr.io' && github.repository_owner || secrets[matrix.username-secret] }}
          password: ${{ secrets[matrix.password-secret] }}
          manager-digest: ${{ needs.build.outputs.manager-digest }}
          agent-digest: ${{ needs.build.outputs.agent-digest }}
          version: ${{ needs.build.outputs.version }}
          channel: release
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

  attest-aliases:
    name: Attest GHCR aliases
    needs: [prepare, build, publish-images]
    runs-on: depot-ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Container image attestation (manager alias)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/getarcaneapp/arcane
          subject-digest: ${{ needs.build.outputs.manager-digest }}
          push-to-registry: true

      - name: Container image attestation (agent alias)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/getarcaneapp/arcane-headless
          subject-digest: ${{ needs.build.outputs.agent-digest }}
          push-to-registry: true

  publish:
    name: Publish release
    needs: [prepare, build, publish-images, attest-aliases]
    runs-on: depot-ubuntu-latest

    steps:
      - name: Request App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ARCANE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARCANE_APP_PRIVATE_KEY }}
          owner: getarcaneapp
          repositories: arcane
          permission-contents: write

      - name: Publish release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false
          echo "Published [$RELEASE_TAG](https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG)." >> "$GITHUB_STEP_SUMMARY"

  update-website-release-assets:
    needs: publish
    if: github.repository == 'getarcaneapp/arcane'
    runs-on: depot-ubuntu-24.04-16
    permissions: {}

    steps:
      - name: Request website App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ARCANE_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARCANE_APP_PRIVATE_KEY }}
          owner: getarcaneapp
          repositories: website
          permission-contents: write

      - name: Dispatch website release assets update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api --method POST repos/getarcaneapp/website/dispatches \
            -f event_type=arcane-release-published
