version: '2'
run:
  tests: false
  timeout: 5m
linters:
  default: none
  enable:
    - shimbad
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - clickhouselint
    - contextcheck
    - copyloopvar
    - decorder
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocognit
    - gocritic
    - gocyclo
    - godoclint
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - zerologlint
  settings:
    custom:
      shimbad:
        type: module
        description: Detects suspicious Go function implementations.
        original-url: https://go.ofkm.dev/shimbad
    forbidigo:
      forbid:
        - pattern: ^errors\.(Wrap|Wrapf|WithStack)$
          msg: use WrapIf, WrapIff, or WithStackIf so an existing stack is preserved
    gomoddirectives:
      replace-local: true
      replace-allow-list:
        # Copacetic v0.14.2 only compiles against the buildx v0.32 imagetools
        # API; drop once copa supports buildx >= 0.35 and the pin is removed.
        - github.com/docker/buildx
    importas:
      alias:
        - pkg: errors
          alias: stderrors
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        text: 'var-naming:'
      - linters:
          - revive
        text: 'unused-parameter:'
      - linters:
          - revive
        text: 'exported:'
      - linters:
          - forbidigo
        path: cli/
      # Endpoint path builders are intentional one-line functions.
      - linters:
          - shimbad
        path: internal/types/endpoints\.go
    paths:
      - '.*\.pb\.go$'
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - '.*\.pb\.go$'
      - third_party$
      - builtin$
      - examples$
